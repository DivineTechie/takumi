<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">TAKUMI architecture</title>
  <desc id="d">Cameras on the factory floor connect through Firebase to two Cloud Run services, which use Gemini models and store data in Firestore and Cloud Storage; every event flows through Pub/Sub into BigQuery.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .floor { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .fire { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .run { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .ai { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .data { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .ops { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .h1 { font: 700 21px 'Noto Sans', system-ui, sans-serif; fill: #0f172a; }
      .h2 { font: 500 13px 'Noto Sans', system-ui, sans-serif; fill: #475569; }
      .t { font: 700 15px 'Noto Sans', system-ui, sans-serif; fill: #0f172a; }
      .s { font: 500 12px 'Noto Sans', system-ui, sans-serif; fill: #334155; }
      .f { font: 600 11px 'Noto Sans', system-ui, sans-serif; fill: #0369a1; }
      .foot { font: 500 12px 'Noto Sans', system-ui, sans-serif; fill: #334155; }
      .a { stroke: #0284c7; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .ad { stroke: #7c3aed; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; marker-end: url(#ahv); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="bg" width="1200" height="790"/>

  <text class="h1" x="30" y="38">TAKUMI (匠): AI quality and operations for factories that aren't connected</text>
  <text class="h2" x="30" y="60">Any camera the factory already has · everything on Google Cloud and Google AI · asia-southeast1</text>

  <!-- Floor -->
  <rect class="floor" x="30" y="85" width="270" height="78" rx="10"/>
  <text class="t" x="45" y="112">Station phone</text>
  <text class="s" x="45" y="132">Station Watch: voice, camera,</text>
  <text class="s" x="45" y="149">pointing, full-screen STOP</text>
  <rect class="floor" x="320" y="85" width="270" height="78" rx="10"/>
  <text class="t" x="335" y="112">Mounted phone / webcam</text>
  <text class="s" x="335" y="132">Machine Watch: free edge checks,</text>
  <text class="s" x="335" y="149">only small crops leave the device</text>
  <rect class="floor" x="610" y="85" width="270" height="78" rx="10"/>
  <text class="t" x="625" y="112">Inspection station</text>
  <text class="s" x="625" y="132">One photo per finished unit,</text>
  <text class="s" x="625" y="149">a person confirms every flag</text>
  <rect class="floor" x="900" y="85" width="270" height="78" rx="10"/>
  <text class="t" x="915" y="112">Supervisor and master</text>
  <text class="s" x="915" y="132">Dashboard, control tower, unit</text>
  <text class="s" x="915" y="149">records, voice copilot, Studio</text>

  <path class="a" d="M165 163 V190"/><path class="a" d="M455 163 V190"/><path class="a" d="M745 163 V190"/><path class="a" d="M1035 163 V190"/>

  <!-- Firebase -->
  <rect class="fire" x="30" y="192" width="1140" height="42" rx="10"/>
  <text class="t" x="45" y="219">Firebase Hosting (React app) · Firebase Auth with roles: trainee, supervisor, master</text>

  <path class="a" d="M355 234 V262"/><path class="a" d="M935 234 V262"/>

  <!-- Cloud Run -->
  <rect class="run" x="30" y="264" width="650" height="150" rx="10"/>
  <text class="t" x="45" y="290">takumi-api · Cloud Run (Python FastAPI)</text>
  <text class="s" x="45" y="314">• End-of-line inspection: Flash-Lite screens against 3 references, Flash confirms</text>
  <text class="s" x="45" y="334">• Station Watch: step watcher, verifier, pointing, station records per unit</text>
  <text class="s" x="45" y="354">• Machine Watch: one-time setup, change-triggered reads, events</text>
  <text class="s" x="45" y="374">• Units, holds, work orders, spoken alerts (Gemini TTS), control tower</text>
  <text class="s" x="45" y="394">• Publishes every event to Pub/Sub (fire-and-forget)</text>
  <rect class="run" x="700" y="264" width="470" height="150" rx="10"/>
  <text class="t" x="715" y="290">takumi-forge · Cloud Run</text>
  <text class="s" x="715" y="314">• Standard Work Studio: Google ADK 2 Workflow graph</text>
  <text class="s" x="715" y="334">  (segment, reasons, pointing hints, verify, translate,</text>
  <text class="s" x="715" y="354">  media in parallel, publish)</text>
  <text class="s" x="715" y="374">• Google ADK agents: maintenance work orders, quality</text>
  <text class="s" x="715" y="394">  trace-back, demand planner (read-only tools, schemas)</text>

  <!-- Voice path -->
  <path class="ad" d="M30 124 H18 V488 H30"/>
  <text class="f" x="10" y="250" transform="rotate(-90 10 250)">voice · single-use token</text>

  <path class="a" d="M366 414 V448"/><path class="a" d="M595 414 V448"/><path class="a" d="M660 414 L800 448"/>
  <path class="a" d="M850 414 V448"/><path class="a" d="M1053 414 V448"/>

  <!-- Models -->
  <rect class="ai" x="30" y="450" width="214" height="74" rx="10"/>
  <text class="t" x="44" y="476">gemini-3.8-live</text>
  <text class="s" x="44" y="497">Station Watch voice and</text>
  <text class="s" x="44" y="513">Ask TAKUMI copilot</text>
  <rect class="ai" x="259" y="450" width="214" height="74" rx="10"/>
  <text class="t" x="273" y="476">gemini-3.5-flash-lite</text>
  <text class="s" x="273" y="497">inspection screen, step</text>
  <text class="s" x="273" y="513">watcher, machine reads</text>
  <rect class="ai" x="488" y="450" width="214" height="74" rx="10"/>
  <text class="t" x="502" y="476">gemini-3.8-flash</text>
  <text class="s" x="502" y="497">inspection confirm, step</text>
  <text class="s" x="502" y="513">verifier, ADK agents</text>
  <rect class="ai" x="717" y="450" width="214" height="74" rx="10"/>
  <text class="t" x="731" y="476">gemini-robotics-er-2</text>
  <text class="s" x="731" y="497">pointing at parts,</text>
  <text class="s" x="731" y="513">Machine Watch setup</text>
  <rect class="ai" x="946" y="450" width="214" height="74" rx="10"/>
  <text class="t" x="960" y="476">gemini-omni-1.1-flash</text>
  <text class="s" x="960" y="497">segments a master's</text>
  <text class="s" x="960" y="513">demonstration video</text>

  <!-- Data -->
  <path class="a" d="M251 414 V556"/><path class="a" d="M480 414 V556"/>
  <rect class="data" x="30" y="558" width="250" height="86" rx="10"/>
  <text class="t" x="44" y="584">Firestore + Cloud Storage</text>
  <text class="s" x="44" y="605">units, inspections, sessions,</text>
  <text class="s" x="44" y="622">machines, skills · media via</text>
  <text class="s" x="44" y="638">signed URLs (source of truth)</text>
  <rect class="data" x="430" y="558" width="200" height="86" rx="10"/>
  <text class="t" x="444" y="584">Pub/Sub</text>
  <text class="s" x="444" y="605">topic takumi-events:</text>
  <text class="s" x="444" y="622">every station, inspection,</text>
  <text class="s" x="444" y="638">machine and hold event</text>
  <path class="a" d="M630 601 H668"/>
  <rect class="data" x="670" y="558" width="250" height="86" rx="10"/>
  <text class="t" x="684" y="584">BigQuery (dataset takumi)</text>
  <text class="s" x="684" y="605">events via BigQuery subscription</text>
  <text class="s" x="684" y="622">(partitioned by day), api_calls,</text>
  <text class="s" x="684" y="638">analytics tables</text>
  <path class="a" d="M920 601 H958"/>
  <rect class="data" x="960" y="558" width="210" height="86" rx="10"/>
  <text class="t" x="974" y="584">Control tower, /evals</text>
  <text class="s" x="974" y="605">KPIs per source: LIVE,</text>
  <text class="s" x="974" y="622">HOME RIG, PUBLIC DATA</text>
  <text class="s" x="974" y="638">never mixed</text>

  <!-- Ops -->
  <rect class="ops" x="30" y="664" width="1140" height="42" rx="10"/>
  <text class="t" x="45" y="691">Model Armor · Secret Manager (keys never reach a browser) · Cloud Monitoring &amp; Logging · Cloud Build CI/CD</text>

  <text class="foot" x="30" y="738">AI informs, people decide: holds, defect decisions and work-instruction changes always need a human approval.</text>
  <text class="foot" x="30" y="758">Privacy: no faces stored, no individual worker scoring, operator identities hidden from the agent.</text>
</svg>
