<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes ping-slow {
      0% {
        transform: scale(0.9);
        opacity: 0.9;
      }
      70%, 100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }
    .animate-ping-slow {
      animation: ping-slow 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
  </style>

<body class="bg-background text-on-surface m-0 p-0 overflow-hidden select-none flex justify-center items-center min-h-screen">
<!-- Mobile Portrait Canvas (390px x 844px) -->
<main class="relative w-[390px] h-[844px] max-w-full max-h-screen overflow-hidden bg-surface-dim shadow-2xl flex flex-col justify-between">
<!-- Edge-to-Edge POV Camera Stream Feed -->
<img alt="POV hands-on camera view of an industrial terminal block electrical panel installation" class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1Vq5QtzpQQg0FDa1peDskbvZFolUcfRBVBcDrJiQFHlyIX3V6RItposijn0t3M8Bqxe4dMEwsxtbFpzFORxMsqGNMG81xN27BF7xI-CVUEWyYq6wCn8o6BdUPHi2-5aDA02uCnn1glOJ9qMNjL36oo_dpfYOTEQXRL7XvaDZAVdb_W0cgzNSDIUU0Ue37TLbFZB0mt8bNOM_jSOd5srnQbAUZMq3dzlJRGYr1-XYmGbdI95k0Bi4RTOsXbw"/>
<!-- TOP BAR: Translucent Dark Navigation & Step Progress -->
<header class="relative z-30 w-full backdrop-blur-md bg-black/60 px-4 py-3 border-b border-white/10 flex items-center justify-between min-h-[56px]">
<!-- Left: Glove-Friendly Back Arrow (44x44) -->
<button aria-label="Back to step index" class="w-11 h-11 flex items-center justify-center rounded-lg bg-surface-container/60 hover:bg-surface-container-high text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Center: Step Progress & Dots -->
<div class="flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-on-surface font-semibold tracking-wide">
          Step 2 of 4
        </span>
<div class="flex items-center gap-1.5 mt-1">
<!-- Step 1: Completed (Green) -->
<div class="w-2.5 h-2.5 rounded-full bg-[#22c55e]"></div>
<!-- Step 2: Active (Safety Amber) -->
<div class="w-3 h-3 rounded-full bg-primary-container ring-2 ring-primary-container/40"></div>
<!-- Step 3: Pending (Muted Grey) -->
<div class="w-2 h-2 rounded-full bg-[#64748b]"></div>
<!-- Step 4: Pending (Muted Grey) -->
<div class="w-2 h-2 rounded-full bg-[#64748b]"></div>
</div>
</div>
<!-- Right: Language Dropdown Pill -->
<button class="flex items-center gap-1.5 h-11 px-3 rounded-full bg-surface-container/60 hover:bg-surface-container-high border border-white/10 text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px] text-primary">translate</span>
<span class="font-label-md text-label-md font-bold tracking-tight">English</span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">expand_more</span>
</button>
</header>
<!-- MIDDLE OF PHOTO: AR Concentric Overlay Target on DIN Terminal Block -->
<div class="relative z-20 flex-1 pointer-events-none flex items-center justify-center">
<!-- Positioned relative target over wire connection zone -->
<div class="relative -translate-y-8 -translate-x-2 flex flex-col items-center">
<!-- Target Reticle Assembly -->
<div class="relative flex items-center justify-center w-28 h-28">
<!-- Pulsing Outer Ping Ring -->
<div class="absolute inset-0 rounded-full border-2 border-primary-container animate-ping-slow"></div>
<!-- Outer Steady Ring with dash ticks -->
<div class="absolute inset-2 rounded-full border-2 border-dashed border-primary-container/80"></div>
<!-- Inner Precision Target Circle -->
<div class="w-8 h-8 rounded-full border-2 border-primary-container bg-primary-container/20 flex items-center justify-center backdrop-blur-xs">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_#f59e0b]"></div>
</div>
</div>
<!-- High-Contrast Floating Pill Tag -->
<div class="mt-1 px-3 py-1 bg-surface-container-lowest/90 border-2 border-primary-container rounded-full flex items-center gap-1.5 shadow-lg backdrop-blur-sm pointer-events-auto">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-code-num text-[17px] leading-tight font-bold text-primary tracking-wide">
            Terminal 2
          </span>
</div>
</div>
</div>
<!-- LOWER REGION: Voice Caption Band & Bottom Instruction Sheet -->
<div class="relative z-30 flex flex-col justify-end w-full">
<!-- FLOATING VOICE CAPTION BAND -->
<section aria-label="Coach audio guidance" class="backdrop-blur-md bg-black/75 border border-white/10 px-4 py-3 mx-4 mb-2.5 rounded-xl flex items-center gap-3.5 shadow-xl">
<!-- Amber Coach/Voice Icon -->
<div class="w-10 h-10 rounded-lg bg-primary-container/20 border border-primary-container/40 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-[24px]">volume_up</span>
</div>
<!-- Live Voice Caption -->
<p class="font-code-num text-code-num font-bold text-white tracking-normal leading-snug">
          “Good. Now insert the brown wire into terminal 2.”
        </p>
</section>
<!-- BOTTOM SHEET: Instructions & Glove Actions -->
<section aria-label="Current SOP verification controls" class="backdrop-blur-lg bg-[#0f141b]/95 border-t border-white/15 rounded-t-2xl px-4 pt-2.5 pb-5 shadow-2xl flex flex-col gap-3.5">
<!-- Pull Handle Indicator -->
<div class="w-12 h-1.5 bg-surface-bright/80 rounded-full mx-auto self-center"></div>
<!-- Instruction Row -->
<div class="flex items-start gap-3.5">
<!-- Reference Thumbnail Image with REF Badge -->
<div class="relative w-[72px] h-[72px] shrink-0 rounded-lg border border-white/20 overflow-hidden bg-surface-container-high shadow-md">
<img alt="Close-up reference diagram of wire inserted in terminal 2 clamp" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1Xdym8JPR80KzvKmODE44_saj0yx6pAkIBtVO64cFxAhXhpgCUh6ai8xZNQ_JtbZtenipUt4MuyZ-vR79NwSvjtucYZSpasrZWaNQ1a_rdl9TAH-dHeTZu2vJk3WrR7hW5Sbu1Oq9X5o7_PazOiVDecPOQ_1R6kSHUenMnJG7M29D47r5tFC_NTel6IPfE-e7d8tbxB8_j-13yWZQpcVeLyg0FRJpxg8QeJdxJQOSzhWM7mz4euvUUFanvn"/>
<span class="absolute top-1 left-1 px-1.5 py-0.2 bg-black/80 border border-white/20 rounded font-label-md text-[11px] font-bold text-primary tracking-wider uppercase">
              REF
            </span>
</div>
<!-- Instruction Details & Status -->
<div class="flex-1 min-w-0 flex flex-col justify-center">
<!-- Status Chip -->
<div class="flex items-center gap-2 mb-1">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container animate-pulse shrink-0"></span>
<span class="font-label-md text-label-md text-primary-fixed-dim uppercase tracking-wider font-semibold">
                Watching… in progress
              </span>
</div>
<!-- Primary Instruction Text -->
<h1 class="font-code-num text-code-num font-bold text-on-surface leading-snug">
              Insert the brown wire into terminal 2 and tighten its screw.
            </h1>
</div>
</div>
<!-- Button Row: 56px+ Touch Target Glove-Friendly Action Buttons -->
<div class="flex items-center gap-3 pt-1">
<!-- "Why?" Auxiliary Button -->
<button class="h-14 w-1/2 rounded-xl bg-surface-container-high hover:bg-surface-bright active:scale-95 text-on-surface font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 border border-slate-700 transition-all shadow-md" type="button">
<span class="material-symbols-outlined text-[24px] text-on-surface-variant">help</span>
<span>Why?</span>
</button>
<!-- "Stop" Safety Amber Outline Action Button -->
<button class="h-14 w-1/2 rounded-xl border-2 border-primary-container text-primary-container bg-primary-container/10 hover:bg-primary-container/20 active:scale-95 font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 transition-all shadow-md" type="button">
<span class="material-symbols-outlined text-[24px]">pause_circle</span>
<span>Stop</span>
</button>
</div>
</section>
</div>
</main>
</body></html>
