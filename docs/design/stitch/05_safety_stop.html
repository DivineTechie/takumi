<div class="relative w-full max-w-[390px] h-[844px] overflow-hidden bg-surface flex flex-col justify-between select-none shadow-2xl"><!-- Full Screen Red Emergency Background with 10% Opacity Camera Image --><div class="absolute inset-0 z-0 bg-[#C62828] overflow-hidden"><img alt="Workstation camera view" class="w-full h-full object-cover opacity-10 mix-blend-luminosity" src="https://lh3.googleusercontent.com/aida/AEtjO1Vq5QtzpQQg0FDa1peDskbvZFolUcfRBVBcDrJiQFHlyIX3V6RItposijn0t3M8Bqxe4dMEwsxtbFpzFORxMsqGNMG81xN27BF7xI-CVUEWyYq6wCn8o6BdUPHi2-5aDA02uCnn1glOJ9qMNjL36oo_dpfYOTEQXRL7XvaDZAVdb_W0cgzNSDIUU0Ue37TLbFZB0mt8bNOM_jSOd5srnQbAUZMq3dzlJRGYr1-XYmGbdI95k0Bi4RTOsXbw"/></div><!-- Main Emergency Content Layer --><div class="relative z-10 flex-1 flex flex-col justify-between px-6 pt-16 pb-8 select-none"><div class="flex-1 flex flex-col items-center justify-center text-center"><!-- 120px Crisp White Stop Hand Icon --><div class="mb-4 flex items-center justify-center"><span class="material-symbols-outlined text-white" style="font-size: 120px; font-variation-settings: 'FILL' 1;">front_hand</span></div><!-- Massive STOP Label --><h1 class="text-white font-extrabold tracking-wide uppercase leading-none mb-6" style="font-size: 72px; font-weight: 900;">STOP</h1><!-- Violation Rule --><p class="text-white font-bold text-center leading-tight mb-4 max-w-[320px]" style="font-size: 28px;">No bare copper visible outside a terminal</p><!-- Direct Imperative --><p class="text-white font-medium tracking-normal text-center" style="font-size: 22px;">Keep your hands away.</p></div><!-- Bottom Action Area --><div class="w-full pt-4"><button class="w-full h-16 min-h-[64px] rounded-xl bg-white text-[#C62828] font-extrabold text-xl shadow-lg active:scale-95 transition-all flex items-center justify-center tracking-wide cursor-pointer" id="safeButton" onclick="confirmSafe()" type="button"><span id="btnText">I've made it safe</span></button></div></div></div>
<script>
    function confirmSafe() {
      const btn = document.getElementById('safeButton');
      const text = document.getElementById('btnText');
      const icon = document.getElementById('btnIcon');

      // Visual feedback for industrial touch confirmation
      btn.classList.remove('bg-surface-bright', 'border-white', 'text-white');
      btn.classList.add('bg-secondary-container', 'border-secondary', 'text-on-secondary-container');
      text.innerText = "VERIFYING CAMERA FEED...";
      icon.innerText = "sync";
      icon.classList.add('animate-spin');

      setTimeout(() => {
        text.innerText = "SAFETY VERIFIED";
        icon.innerText = "check_circle";
        icon.classList.remove('animate-spin');
      }, 1200);
    }
  </script>
