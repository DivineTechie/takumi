<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>TAKUMI</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts: Noto Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-lowest": "#090f15",
            "background": "#0f141b",
            "surface": "#0f141b",
            "surface-container-low": "#171c23",
            "surface-container": "#1b2027",
            "surface-container-high": "#222832",
            "surface-container-highest": "#2c333e",
            "on-surface": "#f1f5f9",
            "on-surface-variant": "#94a3b8",
            "primary-container": "#f59e0b",
            "on-primary-container": "#0f141b",
            "outline-variant": "#2b323d",
            "outline": "#3e4756"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          "fontFamily": {
            "sans": ["Noto Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-sans selection:bg-primary-container selection:text-on-primary-container">
<!-- TOP APP BAR: Simple, Calm Header -->
<header class="bg-surface-container-low border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-[460px] mx-auto px-4 min-h-[64px] flex items-center justify-between">
<!-- Brand Mark & Name -->
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg overflow-hidden shrink-0 flex items-center justify-center">
<img alt="TAKUMI Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1Vwio5CMR2SemmUs4DeV4hFskWFq2jT_Hlpyxqz8oV5zpjuSx5o1IVGdopZ-HrFzyEJRVifDt1Bsh3RdIC1z2aCIh6vylVESuXsZhGW2gxy5UHXDeMnnB1K-0NYkL52Nnl7To2OPBa_Pncs4_p6Kqn78hARPIbcyYib9pk7SnHjJeaj98J2WMSTGjU-lExGL25nxsm9YKbnQF_cjg0gPQS58M6SRqpv3kNO-FLFtQyYeGn0oBX-RuCKrjs">
</div>
<span class="text-[20px] font-bold tracking-wider text-on-surface">TAKUMI</span>
</div>
<!-- Clean Language Switcher Dropdown -->
<div class="relative">
<div class="relative flex items-center">
<label class="sr-only" for="language-select">Select language</label>
<span class="material-symbols-outlined absolute left-3 pointer-events-none text-on-surface-variant text-[20px]" data-icon="language">language</span>
<select class="appearance-none bg-surface-container-high border border-outline-variant text-on-surface text-[15px] font-medium rounded-lg pl-9 pr-8 py-2 focus:outline-none focus:ring-1 focus:ring-primary-container cursor-pointer transition-colors" id="language-select">
<option selected="" value="en">English</option>
<option value="ja">日本語</option>
<option value="vi">Tiếng Việt</option>
<option value="hi">हिन्दी</option>
<option value="id">Bahasa Indonesia</option>
<option value="fil">Filipino</option>
</select>
<span class="material-symbols-outlined absolute right-2 pointer-events-none text-on-surface-variant text-[18px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</header>
<!-- MAIN CONTENT CANVAS -->
<main class="w-full max-w-[460px] mx-auto px-4 pt-6 pb-12 flex-1 flex flex-col">
<!-- Calm Greeting Heading -->
<div class="mb-6">
<h1 class="text-[28px] leading-[36px] font-bold text-on-surface">
      What would you like to do?
    </h1>
</div>
<!-- THREE LARGE VERTICAL CARDS -->
<div class="space-y-5">
<!-- CARD 1: Learn a skill -->
<section class="bg-surface-container-low border border-outline-variant rounded-2xl p-6 shadow-sm flex flex-col justify-between transition-colors">
<div class="mb-5">
<h2 class="text-[24px] leading-[32px] font-bold text-on-surface mb-2">
          Learn a skill
        </h2>
<p class="text-[18px] leading-[26px] text-[#cbd5e1]">
          Get coached step by step through your phone camera
        </p>
</div>
<!-- Action Button -->
<button class="w-full min-h-[56px] py-3.5 px-5 bg-primary-container text-on-primary-container rounded-xl font-bold text-[17px] flex items-center justify-center gap-2 hover:brightness-105 active:scale-[0.99] transition-all shadow" type="button">
<span class="">Start learning</span>
<span class="material-symbols-outlined text-[22px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</section>
<!-- CARD 2: Teach a skill -->
<section class="bg-surface-container-low border border-outline-variant rounded-2xl p-6 shadow-sm flex flex-col justify-between transition-colors">
<div class="mb-5">
<h2 class="text-[24px] leading-[32px] font-bold text-on-surface mb-2">
          Teach a skill
        </h2>
<p class="text-[18px] leading-[26px] text-[#cbd5e1]">
          Record your work once; TAKUMI turns it into a lesson
        </p>
</div>
<!-- Action Button -->
<button class="w-full min-h-[56px] py-3.5 px-5 bg-primary-container text-on-primary-container rounded-xl font-bold text-[17px] flex items-center justify-center gap-2 hover:brightness-105 active:scale-[0.99] transition-all shadow" type="button">
<span class="">Record a skill</span>
<span class="material-symbols-outlined text-[22px]" data-icon="videocam">videocam</span>
</button>
</section>
<!-- CARD 3: See my team -->
<section class="bg-surface-container-low border border-outline-variant rounded-2xl p-6 shadow-sm flex flex-col justify-between transition-colors">
<div class="mb-5">
<h2 class="text-[24px] leading-[32px] font-bold text-on-surface mb-2">
          See my team
        </h2>
<p class="text-[18px] leading-[26px] text-[#cbd5e1]">
          Progress, common mistakes and certificates
        </p>
</div>
<!-- Action Button -->
<button class="w-full min-h-[56px] py-3.5 px-5 bg-primary-container text-on-primary-container rounded-xl font-bold text-[17px] flex items-center justify-center gap-2 hover:brightness-105 active:scale-[0.99] transition-all shadow" type="button">
<span class="">Open dashboard</span>
<span class="material-symbols-outlined text-[22px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</section>
</div>
</main>


</body></html>
