<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>

<span class="material-symbols-outlined text-slate-400 text-[20px] mr-1 pointer-events-none" data-icon="translate">translate</span>
<select aria-label="Select language" class="bg-transparent text-slate-200 font-label-md text-[15px] font-medium pr-6 pl-1 py-1 focus:outline-none focus:ring-0 border-0 cursor-pointer appearance-none">
<option class="bg-[#171c23] text-slate-200" selected="" value="en">English</option>
<option class="bg-[#171c23] text-slate-200" value="ja">日本語</option>
<option class="bg-[#171c23] text-slate-200" value="vi">Tiếng Việt</option>
<option class="bg-[#171c23] text-slate-200" value="hi">हिन्दी</option>
<option class="bg-[#171c23] text-slate-200" value="id">Bahasa Indonesia</option>
<option class="bg-[#171c23] text-slate-200" value="fil">Filipino</option>

<p class="font-body-md text-body-md text-[#cbd5e1] max-w-[280px] leading-relaxed">
        Ask your supervisor to publish one
